{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 700px; margin-top: 25px;">
    <form id="checklist-entrega-cierre" method="post" action="" autocomplete="off">
        <input type="hidden" name="id" value="{{ tarea_id or '' }}">
        <input type="hidden" name="op_no" value="{{ op_no or '' }}">
        <input type="hidden" name="proceso" value="{{ proceso or 'ENTREGA Y CIERRE DE OP' }}">
        <input type="hidden" name="modulo" value="entrega_cierre">

        <div class="checklist-wrap">
            <div class="checklist-title">
                <h3>CHECKLIST: ENTREGA Y CIERRE DE OP</h3>
            </div>
            <table class="checklist-table">
                <thead>
                    <tr>
                        <th class="col-num"></th>
                        <th class="col-desc">DESCRIPCIÓN</th>
                        <th class="col-opt">SI</th>
                        <th class="col-opt">NO</th>
                        <th class="col-opt">N/A</th>
                    </tr>
                </thead>
                {% include "usuario/widgets/entrega_cierre.html" %}
            </table>

            <div class="meta-bottom">
                <div><span class="lbl">OP:</span> <strong>{{ op_no or 'SIN OP' }}</strong></div>
            </div>
            <div class="checklist-actions">
                <button type="submit" class="btn-guardar-checklist">Guardar checklist</button>
            </div>
        </div>
    </form>

    <style>
        #checklist-entrega-cierre { margin-top:15px; }
        .checklist-wrap { background:#fff; border:2px solid #2f2f2f; padding:8px; border-radius:6px; }
        .checklist-title h3 { margin:0; text-align:center; color:#0f6a4f; font-weight:800; }
        .checklist-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:13px; }
        .checklist-table th, .checklist-table td { border:1px solid #3b3b3b; padding:4px 6px; vertical-align:middle; }
        .checklist-table thead th { text-align:center; font-weight:700; background:#f2f2f2; color:#000; }
        .col-num { width:7%; text-align:center; }
        .col-desc { width:68%; }
        .col-opt { width:8.3%; text-align:center; }
        .section-row td { font-weight:700; }
        .section-title { text-transform:uppercase; }
        .opt-head { background:#f2f2f2; }
        .footer-row td { background:#fafafa; font-weight:700; }
        .footer-cell { padding:8px 6px; }
        .footer-label { display:inline-block; margin-right:8px; }
        .footer-input { width:70%; max-width:320px; border:none; border-bottom:1px solid #3b3b3b; outline:none; padding:2px 4px; background:transparent; font-weight:400; }
        .footer-textarea { width:100%; border:1px solid #3b3b3b; padding:6px; font-weight:400; resize:vertical; box-sizing:border-box; }
        .footer-date .date-field { width:96%; max-width:none; }
        .checklist-table td.col-opt { position:relative; overflow:hidden; padding:0; text-align:center; }
        .checklist-table td.col-opt input[type="radio"] { position:relative; margin:0 auto; display:inline-block; width:auto; max-width:16px; }
        .meta-bottom { margin-top:8px; display:flex; gap:16px; align-items:center; font-size:13px; }
        .meta-bottom .lbl { font-weight:700; }
        .checklist-actions { margin-top:10px; text-align:right; }
        .btn-guardar-checklist { background:#0f6a4f; color:#fff; border:none; border-radius:6px; padding:6px 14px; cursor:pointer; }
        .btn-guardar-checklist:hover { opacity:.9; }
    </style>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('checklist-entrega-cierre');
        const opHidden = form?.querySelector('input[name="op_no"]');
        const proceso = (new URLSearchParams(window.location.search).get('proceso') || 'ENTREGA Y CIERRE DE OP').trim();

        if (form) {
          form.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(el => { el.checked = false; });
          form.querySelectorAll('textarea').forEach(el => { el.value = ''; });
          form.addEventListener('submit', function () {
            if (opHidden?.value) sessionStorage.setItem('opChecklist', opHidden.value);
            sessionStorage.setItem('tareaChecklist', proceso);
          });
        }
        if (opHidden?.value) sessionStorage.setItem('opChecklist', opHidden.value);
        sessionStorage.setItem('tareaChecklist', proceso);
      });
    </script>
</div>
{% endblock %}
